<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My NYC want-to-go map: restaurants, cafes, and places saved in my Yelp collection.">

<body class="polished-page places-page" data-map-scope="nyctogo">
  <script src="/nav.js?v=reading-20260923"></script>
  <header class="places-header">
    <div><p class="eyebrow">MY NEXT STOPS</p><h1>NYC, to go</h1><p id="map-stats" aria-live="polite">Loading places…</p></div>
    <div class="map-actions"><label for="place-search">Find a place or address</label><input id="place-search" type="search" placeholder="Try Chinatown, Flushing, or coffee…"><button id="show-all" type="button">Show all NYC</button></div>
    <div class="borough-control"><label for="borough-filter">Borough</label><select id="borough-filter"><option value="all">All NYC</option><option>Manhattan</option><option>Brooklyn</option><option>Queens</option></select></div>
  </header>
  <main class="places-main">
    <div id="map" aria-label="NYC map of places I want to visit"></div>
    <div class="map-note">My Want to go collection. Zoom in to explore.<br>68 business locations · 14 area estimates.<br>Saved September 23, 2026 · <a href="https://www.yelp.com/collection/mZeCEkQN3cWoxmpbBFGaSg/My-Bookmarks" target="_blank" rel="noopener noreferrer">Yelp collection ↗</a></div>
    <div id="map-message" class="map-message" role="status" hidden></div>
    <aside id="place-panel" class="place-panel" aria-labelledby="panel-title" hidden>
      <button id="close-panel" type="button" aria-label="Close place list">×</button>
      <p class="eyebrow">PLACES I WANT TO TRY</p><h2 id="panel-title"></h2><p id="panel-count"></p>
      <ul id="place-list"></ul>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/yelp/script.js?v=tabs-cleanup-20260923"></script>
