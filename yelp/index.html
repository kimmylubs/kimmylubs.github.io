<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A map of the places I've visited, collected from my published Yelp reviews.">
  <title>My Places · Kimmie's Scrapbook</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=places-20260923">
  <link rel="stylesheet" href="../page-polish.css">
</head>
<body class="polished-page places-page">
  <script src="/nav.js"></script>
  <header class="places-header">
    <div><p class="eyebrow">MY LITTLE FOOTPRINTS</p><h1>Everywhere I've been</h1><p id="map-stats" aria-live="polite">Loading places…</p></div>
    <div class="map-actions"><label for="place-search">Find a city or place</label><input id="place-search" type="search" placeholder="Try Brooklyn, coffee, or Paris…"><button id="show-all" type="button">Show all places</button></div>
  </header>
  <main class="places-main">
    <div id="map" aria-label="Map of places visited, grouped by city"></div>
    <div class="map-note">Pins group visits by city or area. Zoom in to separate nearby cities.<br>City-center locations, not exact business addresses.</div>
    <div id="map-message" class="map-message" role="status" hidden></div>
    <aside id="place-panel" class="place-panel" aria-labelledby="panel-title" hidden>
      <button id="close-panel" type="button" aria-label="Close place list">×</button>
      <p class="eyebrow">PLACES I'VE VISITED</p><h2 id="panel-title"></h2><p id="panel-count"></p>
      <ul id="place-list"></ul>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js?v=places-20260923"></script>
  <script src="../page-polish.js"></script>
</body>
</html>
