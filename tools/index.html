<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="/nav.js?v=sections-20260923"></script>
  <div class="tools-wrap">
    <h1 class="page-title">Tools</h1>

    <!-- ── Allergens ── -->
    <div class="dropdown-section" id="allergen-section">
      <button class="dropdown-toggle" id="allergen-toggle">
        <span class="dropdown-label">Allergens</span>
        <span class="dropdown-count" id="allergen-count"></span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="dropdown-body">
        <input type="text" id="allergen-search" class="search-input" placeholder="Search allergens…" autocomplete="off">
        <ul id="allergen-results" class="result-list"></ul>
      </div>
    </div>

    <!-- ── Products ── -->
    <div class="dropdown-section" id="product-section">
      <button class="dropdown-toggle" id="product-toggle">
        <span class="dropdown-label">Products</span>
        <span class="dropdown-count" id="product-count"></span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="dropdown-body">
        <input type="text" id="product-search" class="search-input" placeholder="Search products…" autocomplete="off">
        <ul id="product-results" class="result-list"></ul>
      </div>
    </div>

    <!-- ── Calculator ── -->
    <div class="dropdown-section" id="calc-section">
      <button class="dropdown-toggle" id="calc-toggle">
        <span class="dropdown-label">Calculator</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="dropdown-body">
        <div class="tool-widget">
          <div id="calc-wrap">
            <input type="text" id="display" readonly>
            <div id="calc-buttons">
              <button class="cbtn cbtn-clear" onclick="clearDisplay()">C</button>
              <button class="cbtn" onclick="appendNumber(7)">7</button>
              <button class="cbtn" onclick="appendNumber(8)">8</button>
              <button class="cbtn" onclick="appendNumber(9)">9</button>
              <button class="cbtn cbtn-op" onclick="setOperator('+')">+</button>
              <button class="cbtn" onclick="appendNumber(4)">4</button>
              <button class="cbtn" onclick="appendNumber(5)">5</button>
              <button class="cbtn" onclick="appendNumber(6)">6</button>
              <button class="cbtn cbtn-op" onclick="setOperator('-')">−</button>
              <button class="cbtn" onclick="appendNumber(1)">1</button>
              <button class="cbtn" onclick="appendNumber(2)">2</button>
              <button class="cbtn" onclick="appendNumber(3)">3</button>
              <button class="cbtn cbtn-op" onclick="setOperator('*')">×</button>
              <button class="cbtn" onclick="appendNumber(0)">0</button>
              <button class="cbtn" onclick="appendDecimal()">.</button>
              <button class="cbtn cbtn-eq" onclick="calculateResult()">=</button>
              <button class="cbtn cbtn-op" onclick="setOperator('/')">÷</button>
            </div>
            <div id="calc-hist">
              <div class="hist-header">
                <span>History</span>
                <button id="clear-hist-btn">Clear</button>
              </div>
              <ul id="history-list"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Unix Time ── -->
    <div class="dropdown-section" id="unix-section">
      <button class="dropdown-toggle" id="unix-toggle">
        <span class="dropdown-label">Unix Time Generator</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="dropdown-body">
        <div class="tool-widget">
          <div id="unix-wrap">
            <label for="unix-date">Date</label>
            <input type="date" id="unix-date">
            <label for="unix-time">Time</label>
            <input type="time" id="unix-time" value="12:00">
            <div class="unix-btns">
              <button onclick="genUnix()">Generate</button>
              <button onclick="copyUnix()">Copy Discord Format</button>
            </div>
            <p class="unix-hint">Copy Discord Format pastes directly into Discord as a timestamp.</p>
            <p id="unix-result" class="unix-result"></p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="/allergens/allergenList.js"></script>
  <script src="/allergens/productList.js"></script>
  <script>
    // ── Allergens + Products ──────────────────────────────────────────────────
    function renderList(ul, items, query) {
      const filtered = (query.trim()
        ? items.filter(i => i.toLowerCase().includes(query.toLowerCase()))
        : [...items]
      ).sort((a, b) => a.localeCompare(b));
      ul.innerHTML = filtered.length
        ? filtered.map(i => `<li>${i}</li>`).join('')
        : '<li class="result-hint">No results.</li>';
    }

    function setupList(sectionId, toggleId, searchId, resultsId, data) {
      const section = document.getElementById(sectionId);
      const toggle  = document.getElementById(toggleId);
      const search  = document.getElementById(searchId);
      const results = document.getElementById(resultsId);
      toggle.addEventListener('click', () => {
        section.classList.toggle('open');
        if (section.classList.contains('open') && !results.children.length) {
          renderList(results, data, '');
        }
      });
      search.addEventListener('input', () => renderList(results, data, search.value));
    }

    document.getElementById('allergen-count').textContent = window.itemList.length;
    document.getElementById('product-count').textContent  = window.ProductList.length;
    setupList('allergen-section', 'allergen-toggle', 'allergen-search', 'allergen-results', window.itemList);
    setupList('product-section',  'product-toggle',  'product-search',  'product-results',  window.ProductList);

    // ── Calculator ────────────────────────────────────────────────────────────
    const calcSection = document.getElementById('calc-section');
    document.getElementById('calc-toggle').addEventListener('click', () => {
      calcSection.classList.toggle('open');
    });

    const display = document.getElementById('display');
    const OP_SYM  = { '+': '+', '-': '−', '*': '×', '/': '÷' };
    let c1 = null, c2 = null, cop = null;
    const HIST_KEY = 'calc_history';
    let calcHist = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');

    function renderHistory() {
      const list = document.getElementById('history-list');
      if (!list) return;
      list.innerHTML = calcHist.length
        ? calcHist.map(h => `<li class="history-item" data-result="${h.result}"><span class="history-expr">${h.expr}</span><span class="history-result">${h.result}</span></li>`).join('')
        : '<li class="history-empty">No calculations yet</li>';
      list.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', () => { c1 = parseFloat(item.dataset.result); c2 = null; cop = null; display.value = c1; });
      });
    }

    function pushHistory(expr, result) {
      calcHist.unshift({ expr, result });
      if (calcHist.length > 30) calcHist.pop();
      localStorage.setItem(HIST_KEY, JSON.stringify(calcHist));
      renderHistory();
    }

    document.getElementById('clear-hist-btn').addEventListener('click', () => {
      calcHist = []; localStorage.removeItem(HIST_KEY); renderHistory();
    });
    renderHistory();

    function calculateResult() {
      if (c1 === null || c2 === null || cop === null) return;
      let result;
      switch (cop) {
        case '+': result = c1 + c2; break; case '-': result = c1 - c2; break;
        case '*': result = c1 * c2; break; case '/': result = c1 / c2; break;
        default: return;
      }
      pushHistory(`${c1} ${OP_SYM[cop]} ${c2}`, parseFloat(result.toPrecision(12)));
      display.value = parseFloat(result.toPrecision(12));
      c1 = parseFloat(result.toPrecision(12)); c2 = null; cop = null;
    }

    function appendNumber(n) {
      if (cop === null) { c1 = c1 !== null ? parseFloat(`${c1}${n}`) : n; display.value = c1; }
      else { c2 = c2 !== null ? parseFloat(`${c2}${n}`) : n; display.value = c2; }
    }

    function setOperator(op) { if (c1 !== null && c2 !== null) calculateResult(); cop = op; }

    function clearDisplay() { c1 = null; c2 = null; cop = null; display.value = ''; }

    function appendDecimal() {
      if (cop === null) { c1 = c1 !== null ? `${c1}.` : '0.'; display.value = c1; }
      else { c2 = c2 !== null ? `${c2}.` : '0.'; display.value = c2; }
    }

    // ── Unix Time ─────────────────────────────────────────────────────────────
    const unixSection = document.getElementById('unix-section');
    document.getElementById('unix-toggle').addEventListener('click', () => {
      unixSection.classList.toggle('open');
    });

    const dateInput = document.getElementById('unix-date');
    const today = new Date();
    dateInput.value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    function genUnix() {
      const d = document.getElementById('unix-date').value;
      const t = document.getElementById('unix-time').value;
      const [y,m,day] = d.split('-').map(Number);
      const [h,min]   = t.split(':').map(Number);
      const unix = Math.floor(new Date(y, m-1, day, h, min).getTime() / 1000);
      document.getElementById('unix-result').textContent = `Unix: ${unix}  ·  Discord: <t:${unix}:F>`;
      return `<t:${unix}:F>`;
    }

    function copyUnix() {
      const text = genUnix();
      navigator.clipboard.writeText(text).catch(() => {});
    }
  </script>
</body>
</html>
